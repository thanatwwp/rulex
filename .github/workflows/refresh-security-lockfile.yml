name: Refresh security dependency lockfile
on:
  push:
    branches:
      - security/critical-nextjs-node-patch-2026
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Push updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile is current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: refresh lockfile for patched Next.js'
          git push
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
